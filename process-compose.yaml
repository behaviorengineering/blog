# Hugo drafts+future, content-pipelines MCP, carousel-save.
# Start: make serve
# Requires process-compose, hugo, and go on PATH.
# content-pipelines-mcp.yaml sets pipelines_bin + pipelines_dir (n8n repo root with config.yaml).
# Go processes use `go tool wgo` so they rebuild when .go files change (MCP via scripts/serve-content-pipelines-mcp.sh).

version: "0.5"

log_level: info
log_length: 200

processes:
  hugo:
    command: hugo server --buildDrafts --buildFuture
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10

  carousel-save:
    command: ./scripts/serve-process.sh go tool wgo run ./cmd/carousel-save -addr 127.0.0.1:3848 -root .
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 5

  content-pipelines-mcp:
    command: ./scripts/serve-process.sh ./scripts/serve-content-pipelines-mcp.sh
    environment:
      - "PIPELINES_BIN=/Users/hector/Xynova/ai/n8n/bin/pipelines"
      - "PIPELINES_DIR=/Users/hector/Xynova/ai/n8n"
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10
