# Hugo drafts+future, content-pipelines MCP, carousel-save.
# Start: go tool task serve
# Requires process-compose, hugo, and go on PATH.
# User-level MCP config supplies PIPELINES_BIN / PIPELINES_DIR and credential refs.
# All Go services are prebuilt by scripts/serve-up.sh (task serve); wgo rebuilds the same tmp/ binaries.

version: "0.5"

log_level: info
log_length: 200

processes:
  hugo:
    command: hugo server --buildDrafts --buildFuture
    readiness_probe:
      exec:
        command: curl -sf http://127.0.0.1:1313/
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10

  carousel-save:
    command: ./scripts/serve-process.sh ./scripts/serve-carousel-save.sh
    readiness_probe:
      exec:
        command: curl -sf http://127.0.0.1:3848/api/health
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 5

  pipelines-api:
    command: ./scripts/serve-process.sh ./scripts/serve-pipelines-api.sh
    environment:
      - POLYPUS_URL=https://polypus.manticore-powan.ts.net
      - POLYPUS_BASE_URL=https://polypus.manticore-powan.ts.net
      - POLYPUS_OTLP_ENDPOINT=polypus.manticore-powan.ts.net:4317
    readiness_probe:
      exec:
        command: curl -sf http://127.0.0.1:3850/readyz
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 35

  content-pipelines-mcp:
    command: ./scripts/serve-process.sh ./scripts/serve-content-pipelines-mcp.sh
    environment:
      - PIPELINES_API_URL=http://127.0.0.1:3850
      - POLYPUS_URL=https://polypus.manticore-powan.ts.net
      - POLYPUS_BASE_URL=https://polypus.manticore-powan.ts.net
      - POLYPUS_OTLP_ENDPOINT=polypus.manticore-powan.ts.net:4317
    depends_on:
      pipelines-api:
        condition: process_healthy
    readiness_probe:
      exec:
        command: curl -sf http://127.0.0.1:3849/readyz
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10
