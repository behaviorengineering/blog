# Hugo drafts+future, sitekit MCP, carousel-save.
# Start: make serve
# Requires process-compose, hugo, and go on PATH.
# sitekit.yaml sets pipelines_bin + pipelines_dir (n8n repo root with config.yaml).
# Go processes use `go tool wgo` so they rebuild when .go files change (sitekit-mcp also watches ../sitekit).

version: "0.5"

log_level: info
log_length: 200

processes:
  hugo:
    command: hugo server --buildDrafts --buildFuture
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10

  carousel-save:
    command: go tool wgo run ./cmd/carousel-save -addr 127.0.0.1:3848 -root .
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10

  sitekit-mcp:
    command: go tool wgo run -root ../sitekit ./cmd/sitekit-mcp --config sitekit.yaml
    environment:
      - "PIPELINES_BIN=/Users/hector/Xynova/ai/n8n/bin/pipelines"
      - "PIPELINES_DIR=/Users/hector/Xynova/ai/n8n"
    availability:
      restart: on_failure
      backoff_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 10
