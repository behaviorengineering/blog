# Carousel preview dev: do not cache shared renderer assets (make serve).
[server]
  [[server.headers]]
    for = '/carousel/**'
    [server.headers.values]
      Cache-Control = 'no-store, no-cache, must-revalidate'
      Pragma = 'no-cache'