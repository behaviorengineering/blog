baseURL = 'https://behaviorengineering.ai/'
theme = 'LoveIt'
defaultContentLanguage = 'en'
# English stays at / ; Spanish at /es/ (preserves existing URLs).
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    weight = 1
    languageCode = 'en'
    languageName = 'English'
    hasCJKLanguage = false
    title = 'behaviorengineering.ai'
  [languages.es]
    weight = 2
    languageCode = 'es'
    languageName = 'Español'
    hasCJKLanguage = false
    title = 'behaviorengineering.ai'

  # Spanish permalinks can differ from section folder names.
  [languages.es.permalinks]
    social-protocols = "/protocolos-sociales/:slug/"

[languages.es.params]
  description = "Ensayos sobre comportamiento, realidad compartida e infraestructura mental; sátira de oficina y sabiduría callejera; vídeos curados."

[languages.es.params.search]
  placeholder = "Buscar..."

[languages.es.params.footer]
  custom = """<section class="subscribe-box">
  <h3>Síguenos para novedades</h3>
  <p>Actualizaciones en Facebook. Ensayos y señales por correo en Substack.</p>
  <div class="subscribe-box__actions">
    <a class="subscribe-box__btn subscribe-box__btn--facebook" href="https://www.facebook.com/profile.php?id=61588760430373" target="_blank" rel="noopener noreferrer">
      Seguir en Facebook
    </a>
    <a class="subscribe-box__btn subscribe-box__btn--secondary" href="https://behaviorengineeringes.substack.com/subscribe" target="_blank" rel="noopener noreferrer">
      Suscribirse en Substack
    </a>
  </div>
</section>"""
  license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-sa/4.0/deed.es" target="_blank">CC BY‑SA 4.0</a>'

[languages.es.params.home.profile]
  subtitle = "bienvenido"

[languages.es.params.home.psychFitness]
  title = "Estándares de aptitud psicológica para los máximos cargos de Australia"

# whether to use robots.txt
enableRobotsTXT = true

# whether to use git commit log
#enableGitInfo = true

# whether to use emoji code
enableEmoji = true


# Pagination config
[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

[params]
  # Must match root defaultContentLanguage. Used in layouts for cross-locale listing fallbacks (Hugo 0.152 templates lack site.DefaultContentLanguage / .Site.IsDefault).
  defaultContentLanguageCode = "en"
  # Default for meta description + Open Graph / Twitter Cards when a page omits its own.
  # Per-page `og_description` overrides social/meta text without changing list Claim (`description`).
  description = "Essays on behavior, shared reality, and mind-infrastructure; cube-farm satire and Street Wisdom; curated video picks."
  images = ["/images/og-default.png"]
  # Display dates like 04-Oct-2026 (Go reference layout 02-Jan-2006).
  dateFormat = "02-Jan-2006"
  # List/tile view: shorter date without year (e.g., 04-Oct).
  listDateFormat = "02-Jan"
  # Google Tag Manager (production only; see layouts/partials/google-tag-manager-*.html).
  # Configure GA4 inside the GTM container, not via params.analytics.google.
  googleTagManager = "GTM-K9CJFDNH"
  # Meta (Facebook) Pixel base code (production only; see layouts/partials/meta-pixel-head.html).
  metaPixel = "3502202719956413"
  #defaultTheme = "light"
  
  # Header config
  [params.header]
    # desktop header mode ["fixed", "normal", "auto"]
    desktopMode = "fixed"
    # mobile header mode ["fixed", "normal", "auto"]
    mobileMode = "auto"
    # Header title config
    [params.header.title]
      # URL of the LOGO
      logo = "/images/head.svg"
      # Put "behavior" in pre field (supports HTML)
      pre = 'behavior'
      # Put "engineering.ai" in name field
      name = "engineering.ai"
      post = ""
      # whether to use typeit animation for title name
      typeit = false

  # Search config
  [params.search]
    enable = false
    # type of search engine ["lunr", "algolia"]
    type = "lunr"
    # max index length of the chunked content
    contentLength = 4000
    # placeholder of the search bar
    placeholder = "Search..."
    # max number of results length
    maxResultLength = 10
    # snippet length of the result
    snippetLength = 30
    # HTML tag name of the highlight part in results
    highlightTag = "em"
    # whether to use the absolute URL based on the baseURL in search index
    absoluteURL = false
    
  [params.app]
    title = "behaviorengineering.ai"
    svgFavicon = "/images/favicon.ico"

  # Author config
  [params.author]
    name = "xynova"
    email = ""
    link = "https://xynova.com/"

  # Post share row (LoveIt sharer.js). All keys set so theme defaults do not linger.
  [params.page.share]
    enable = true
    X = true
    Twitter = false
    Threads = true
    Facebook = true
    Linkedin = true
    Whatsapp = true
    Viber = false
    Pinterest = false
    Tumblr = false
    HackerNews = false
    Reddit = false
    VK = false
    Buffer = false
    Xing = false
    Line = false
    Instapaper = false
    Pocket = false
    Flipboard = false
    Weibo = false
    Blogger = false
    Baidu = false
    Odnoklassniki = false
    Evernote = false
    Skype = false
    Trello = false
    Diaspora = false
    Mix = false
    Telegram = false

  # Footer config
  [params.footer]
    enable = true
    # Custom content (HTML format is supported)
    custom = """<section class="subscribe-box">
  <h3>Follow for updates</h3>
  <p>Posts on Facebook. New essays by email on Substack.</p>
  <div class="subscribe-box__actions">
    <a class="subscribe-box__btn subscribe-box__btn--facebook" href="https://www.facebook.com/profile.php?id=61588760430373" target="_blank" rel="noopener noreferrer">
      Follow on Facebook
    </a>
    <a class="subscribe-box__btn subscribe-box__btn--secondary" href="https://behaviorengineering.substack.com" target="_blank" rel="noopener noreferrer">
      Subscribe on Substack
    </a>
  </div>
</section>"""
    # whether to show Hugo and theme info
    hugo = false
    # whether to show copyright info
    copyright = true
    # whether to show the author
    author = true
    # site creation time
    since = 2026
    # ICP info only in China (HTML format is supported)
    icp = ""
    # license info (HTML format is supported)
    license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-sa/4.0/deed.en" target="_blank">CC BY‑SA 4.0</a>'


  # Home page config
  [params.home]
    # amount of RSS pages
    rss = 15
    [params.home.profile]
      enable = false
      # Gravatar Email for preferred avatar in home page
      gravatarEmail = ""
      # URL of avatar shown in home page
      avatarURL = ""
      # title shown in home page (HTML format is supported)
      title = ""
      # subtitle shown in home page (HTML format is supported)
      subtitle = "welcome to the thing"
      # whether to use typeit animation for subtitle
      typeit = true
      # whether to show social links
      social = true
      # disclaimer (HTML format is supported)
      disclaimer = ""
    [params.home.posts]
      enable = true
      # special amount of posts in each home posts page (legacy mode only; see contentSections)
      paginate = 6
      # Legacy: not used by home bands when afterHeroTiles is set (kept for docs / older notes).
      perSectionLimit = 3
      # Home band: one lead row (newest) plus this many compact tiles per section (0–4).
      # Default for most sections; override per slug in afterHeroTilesBySection (table below).
      afterHeroTiles = 2
      # Band order on home: "latestFirst" = sections with a band are sorted by newest post in that band (build time).
      # "sectionOrder" = same order as contentSections below.
      sectionBandOrder = "latestFirst"
      # Top-level sections shown as separate bands on the home page (order matches this list).
      # Omit static pages (e.g. "about"). If empty or unset, home feed uses type "posts" only (legacy).
      contentSections = [
        "cognitive-memetics",
        "human-condition",
        "mind-infrastructure",
        "social-protocols",
      ]

    # Per-section tile count under the lead row (slug → count, 0–4). Unlisted sections use afterHeroTiles.
    [params.home.posts.afterHeroTilesBySection]
      cognitive-memetics = 3

    # Psych Fitness 28: separate home band (one post per calendar day in timeZone; see layouts/partials/home-psych-fitness-daily.html).
    [params.home.psychFitness]
      enable = true
      timeZone = "Australia/Sydney"
      pathPrefix = "cognitive-memetics/psych-fitness-28/"
      title = "Psychological fitness standards for Australia's highest offices"


  # List (category or tag) page config
  [params.list]
    # special amount of posts in each list page (section lists, category/tag tile views)
    paginate = 10
    # Same as params.dateFormat (taxonomy/list and similar use this when theme layout applies).
    dateFormat = "02-Jan-2006"
    # amount of RSS pages
    rss = 10

